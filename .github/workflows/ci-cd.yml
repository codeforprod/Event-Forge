# CI/CD Pipeline — test, then publish NPM + PyPI in parallel
#
# On pull_request: run tests only
# On push to main: run tests, then in parallel:
#   - release-npm: changesets creates PR or publishes NPM packages
#   - release-python: publishes to PyPI if version changed
#
# PyPI Trusted Publisher must be configured with:
#   workflow: ci-cd.yml
#   environment: pypi

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Verify npm packages include dist/
        run: |
          set -e
          verify_package() {
            local pkg_dir=$1
            local pkg_name=$2
            echo "Checking $pkg_name..."
            cd "$pkg_dir"
            pnpm pack 2>&1 > /dev/null
            tarball=$(ls *.tgz)
            if tar -tzf "$tarball" | grep -q "dist/.*\.js"; then
              echo "  $pkg_name includes dist/ files"
              rm "$tarball"
              cd - > /dev/null
              return 0
            else
              echo "  ERROR: dist/ files missing in $pkg_name"
              rm "$tarball"
              cd - > /dev/null
              return 1
            fi
          }
          cd packages
          verify_package "core" "@prodforcode/event-forge-core"
          verify_package "adapter-typeorm" "@prodforcode/event-forge-typeorm"
          verify_package "adapter-mongoose" "@prodforcode/event-forge-mongoose"
          verify_package "publisher-rabbitmq" "@prodforcode/event-forge-rabbitmq-publisher"
          verify_package "consumer-rabbitmq" "@prodforcode/event-forge-rabbitmq-consumer"
          verify_package "nestjs" "@prodforcode/event-forge-nestjs"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python package builds
        working-directory: packages/python
        run: |
          python -m pip install --upgrade pip build
          python -m build
          pip install dist/*.whl
          python -c "
          from event_forge import OutboxService, InboxService, EventForgeAgentClient
          from event_forge import OutboxConfig, InboxConfig
          from event_forge import CreateOutboxMessageDto, CreateInboxMessageDto
          from event_forge.events import SimpleEventEmitter, OutboxEvents, InboxEvents
          print('Python imports verified')
          "

  release-npm:
    name: Release NPM
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run ci:publish
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-python:
    name: Release Python
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/event-forge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if Python version needs publishing
        id: check
        run: |
          LOCAL_VERSION=$(grep '^version' packages/python/pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Local version: $LOCAL_VERSION"

          PYPI_VERSION=$(curl -s https://pypi.org/pypi/event-forge/json 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || echo "0.0.0")
          echo "PyPI version: $PYPI_VERSION"

          if [ "$LOCAL_VERSION" = "$PYPI_VERSION" ]; then
            echo "Version $LOCAL_VERSION already published, skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $LOCAL_VERSION (PyPI has $PYPI_VERSION), publishing"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check.outputs.should_publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python package
        if: steps.check.outputs.should_publish == 'true'
        working-directory: packages/python
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        if: steps.check.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
          attestations: true
