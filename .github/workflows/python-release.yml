# Python Release — publish event-forge to PyPI
#
# Triggers:
#   - workflow_call: called from npm-release.yml after NPM packages are published
#   - workflow_dispatch: manual trigger for standalone Python releases
#
# PyPI Trusted Publisher must be configured with:
#   workflow: python-release.yml
#   environment: pypi

name: Python Release

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build Python Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build Python package
        working-directory: packages/python
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dists
          path: packages/python/dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/event-forge

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
